name: bugfix-lab

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  observe:
    name: cue-windows-meeting-audio-not-started
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Run the oracle script
        id: oracle
        shell: pwsh
        run: |
          .\scripts\bugfix-lab\cue-windows-meeting-audio-not-started.ps1
          $code = $LASTEXITCODE
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit $code
        continue-on-error: true

      - name: Report the oracle's verdict
        shell: pwsh
        run: |
          Write-Host "Oracle exit code: ${{ steps.oracle.outputs.exit_code }}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bugfix-lab-evidence
          path: |
            cdp-result.json
            cue-screenshot.png
            cue-main-process.log
            cue-main-process.log.err
          if-no-files-found: warn

      - name: Fail the job when the oracle could not run
        if: always() && steps.oracle.outputs.exit_code == '2'
        shell: pwsh
        run: exit 1
name: bugfix-lab oracle (cue-mic-not-detected-gemini)
  workflow_dispatch:
    inputs:
      test_ref:
        description: "Commit SHA or ref of cue to run the oracle against"
        required: true
  oracle:
      - name: Checkout tooling (this branch — oracle harness + ps1)
          path: tooling
      - name: Checkout target ref under test
          path: target
          ref: ${{ inputs.test_ref }}
          fetch-depth: 1
      - name: Setup Node
          node-version: "22"
      - name: Run oracle
          pwsh -File tooling/scripts/bugfix-lab/cue-mic-not-detected-gemini.ps1 `
            -TargetDir "${{ github.workspace }}/target"
  reproduce:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
          cache: 'npm'
        run: pwsh -File scripts/bugfix-lab/cue-windows-overlay-not-visible-for-mic-grant.ps1
      - name: Upload desktop screenshot
          name: bugfix-lab-desktop-screenshot
          path: bugfix-lab-desktop.png
          if-no-files-found: ignore
      - name: Upload window content capture
          name: bugfix-lab-window-capture
          path: cue-window-capture.png
          if-no-files-found: ignore
        run: pwsh -File scripts/bugfix-lab/cue-windows-drag-permission-latency-bundle.ps1
      bundle_whisper:
        description: "Set CUE_BUNDLE_WHISPER=1 for the build (opt-in bundling path; used only as a sensitivity/negative-control run, never the default reproduction)"
        required: false
        default: "0"
      - name: Run oracle (cue-windows-whisper-runtime-missing)
        env:
          # after-pack.js checks `if (!process.env.CUE_BUNDLE_WHISPER)`, and the
          # string "0" is truthy in JS -- so the default/off case must leave the
          # var genuinely empty (falsy), not set it to the literal text "0".
          CUE_BUNDLE_WHISPER: ${{ github.event.inputs.bundle_whisper == '1' && '1' || '' }}
          .\scripts\bugfix-lab\cue-windows-whisper-runtime-missing.ps1
